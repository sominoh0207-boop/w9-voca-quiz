<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>영어 단어 퀴즈</title>
  <!-- Supabase JS v2 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background-color: #ffffff;
      width: 100%;
      max-width: 480px;
      border-radius: 12px;
      padding: 28px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }
    .progress-bar {
      font-size: 14px;
      color: #6b7280;
      margin-bottom: 8px;
      font-weight: 600;
    }
    .word {
      font-size: 28px;
      font-weight: 700;
      color: #111827;
      margin-bottom: 24px;
    }
    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .option-btn {
      padding: 14px;
      font-size: 16px;
      background-color: #f9fafb;
      border: 1.5px solid #e5e7eb;
      border-radius: 8px;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s ease;
      color: #1f2937;
    }
    .option-btn:hover:not(:disabled) {
      background-color: #f3f4f6;
      border-color: #d1d5db;
    }
    .option-btn:disabled {
      cursor: not-allowed;
    }
    .option-btn.correct {
      background-color: #d1fae5;
      border-color: #10b981;
      color: #065f46;
      font-weight: 600;
    }
    .option-btn.wrong {
      background-color: #fee2e2;
      border-color: #ef4444;
      color: #991b1b;
      font-weight: 600;
    }
    .feedback {
      margin-top: 16px;
      font-weight: 600;
      font-size: 15px;
      min-height: 24px;
    }
    .feedback.correct {
      color: #059669;
    }
    .feedback.wrong {
      color: #dc2626;
    }
    .next-btn, .restart-btn {
      margin-top: 20px;
      width: 100%;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .next-btn:hover, .restart-btn:hover {
      background-color: #1d4ed8;
    }
    .status-msg {
      margin-top: 12px;
      font-size: 12px;
      color: #9ca3af;
      text-align: center;
    }
    .score-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 12px;
      text-align: center;
    }
    .score-val {
      font-size: 48px;
      font-weight: 800;
      color: #2563eb;
      text-align: center;
      margin-bottom: 24px;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- 퀴즈 화면 -->
    <div id="quiz-view">
      <div id="progress" class="progress-bar">문제 1 / 3</div>
      <div id="word" class="word">abundant</div>
      <div id="options" class="options"></div>
      <div id="feedback" class="feedback"></div>
      <button id="next-btn" class="next-btn hidden" onclick="nextQuestion()">다음 문제</button>
      <div id="status" class="status-msg"></div>
    </div>

    <!-- 결과 화면 -->
    <div id="result-view" class="hidden">
      <div class="score-title">퀴즈 완료!</div>
      <div id="final-score" class="score-val">0 / 3</div>
      <button class="restart-btn" onclick="restartQuiz()">다시 풀기</button>
    </div>
  </div>

  <script>
    // 1. Supabase 설정
    const SUPABASE_URL = "YOUR_SUPABASE_URL";
    const SUPABASE_PUBLISHABLE_KEY = "YOUR_PUBLISHABLE_KEY";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    // 2. 퀴즈 데이터
    const questions = [
      {
        no: 1,
        word: "abundant",
        options: ["조용한", "풍부한", "위험한", "느린"],
        answer: "풍부한"
      },
      {
        no: 2,
        word: "reluctant",
        options: ["주저하는", "열정적인", "정확한", "부지런한"],
        answer: "주저하는"
      },
      {
        no: 3,
        word: "brief",
        options: ["강력한", "평범한", "짧은", "불규칙한"],
        answer: "짧은"
      }
    ];

    // 3. 상태 변수
    let currentIdx = 0;
    let score = 0;
    let currentAttemptId = "";
    let startTime = 0;
    let answered = false;

    // 4. 초기화 함수
    function initQuiz() {
      currentIdx = 0;
      score = 0;
      currentAttemptId = crypto.randomUUID();
      document.getElementById("quiz-view").classList.remove("hidden");
      document.getElementById("result-view").classList.add("hidden");
      loadQuestion();
    }

    // 5. 문제 로드 함수
    function loadQuestion() {
      const q = questions[currentIdx];
      answered = false;

      document.getElementById("progress").innerText = `문제 ${q.no} / 3`;
      document.getElementById("word").innerText = q.word;
      document.getElementById("feedback").innerText = "";
      document.getElementById("feedback").className = "feedback";
      document.getElementById("status").innerText = "";
      document.getElementById("next-btn").classList.add("hidden");

      const optionsDiv = document.getElementById("options");
      optionsDiv.innerHTML = "";

      q.options.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerText = opt;
        btn.onclick = () => selectAnswer(opt, btn);
        optionsDiv.appendChild(btn);
      });

      // 응답 시간 측정 시작 시점 기록
      startTime = performance.now();
    }

    // 6. 답안 선택 처리 함수
    async function selectAnswer(chosen, selectedBtn) {
      if (answered) return;
      answered = true;

      // 응답 시간 계산 (ms)
      const responseTimeMs = Math.round(performance.now() - startTime);

      const q = questions[currentIdx];
      const isCorrect = (chosen === q.answer);

      if (isCorrect) score++;

      // UI 피드백 표시
      const buttons = document.querySelectorAll(".option-btn");
      buttons.forEach(btn => {
        btn.disabled = true;
        if (btn.innerText === q.answer) {
          btn.classList.add("correct");
        }
      });

      if (!isCorrect) {
        selectedBtn.classList.add("wrong");
      }

      const feedbackEl = document.getElementById("feedback");
      feedbackEl.innerText = isCorrect ? "정답입니다!" : `오답입니다. (정답: ${q.answer})`;
      feedbackEl.className = `feedback ${isCorrect ? "correct" : "wrong"}`;

      document.getElementById("next-btn").innerText = (currentIdx === questions.length - 1) ? "결과 보기" : "다음 문제";
      document.getElementById("next-btn").classList.remove("hidden");

      // Supabase INSERT 실행
      try {
        const { error } = await supabaseClient
          .from("quiz_answers")
          .insert([
            {
              attempt_id: currentAttemptId,
              question_no: q.no,
              english_word: q.word,
              chosen_answer: chosen,
              is_correct: isCorrect,
              response_time_ms: responseTimeMs
            }
          ]);

        if (error) {
          document.getElementById("status").innerText = "저장 실패 (퀴즈 진행 가능)";
        } else {
          document.getElementById("status").innerText = "저장 성공";
        }
      } catch (err) {
        document.getElementById("status").innerText = "저장 실패 (퀴즈 진행 가능)";
      }
    }

    // 7. 다음 문제 진행 함수
    function nextQuestion() {
      currentIdx++;
      if (currentIdx < questions.length) {
        loadQuestion();
      } else {
        showResult();
      }
    }

    // 8. 최종 결과 화면 표시
    function showResult() {
      document.getElementById("quiz-view").classList.add("hidden");
      document.getElementById("result-view").classList.remove("hidden");
      document.getElementById("final-score").innerText = `${score} / 3`;
    }

    // 9. 다시 풀기
    function restartQuiz() {
      initQuiz();
    }

    // 페이지 진입 시 실행
    window.onload = initQuiz;
  </script>
</body>
</html>
